[project]
name = "valence"
version = "0.1.0"
description = "Financial modelling and valuation platform"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pandas>=2.2",
    "numpy>=1.26",
    "openpyxl>=3.1",
    "pdfplumber>=0.11",
    "yfinance>=0.2.36",
    "requests>=2.31",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
markers = [
    "network: reaches out to SEC EDGAR, so it fails when the network is unavailable",
]