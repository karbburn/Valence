services:
  - type: web
    name: valence-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: TWELVEDATA_API_KEY
        sync: false
      - key: VALENCE_ENV
        value: production
      - key: CORS_ORIGINS
        value: https://valence.sourabhpradhan.in,https://valence-valuation.vercel.app,http://localhost:3000