name: Refresh market prices

# Daily refresh of backend/data/cache/market_data_cache.json — the latest daily
# close for every onboarded company, from free sources (yfinance daily close ->
# Stooq free CSV -> TwelveData when keyed). Runs shortly after the US close.
#
# This job REPORTS. It used to open a review PR, and that was wrong for two
# reasons:
#
#   1. The file is no longer tracked. get_company_market_data() re-fetches
#      whenever the cached fetch_date is not today, so the API heals itself on
#      the first request of the day and a committed copy was stale on arrival.
#   2. A daily automated PR against a file every human PR also touches is a
#      standing merge conflict. It would have needed rebasing before any review
#      could start.
#
# So the output is a step summary: which quotes refreshed, which went stale, and
# which providers failed. A human reads that. A ticker that cannot be quoted is
# a real finding and should page someone, not sit in a diff.
#
# No price is hardcoded anywhere in the repo: the registry holds shares/beta
# only, so this cache is the single source of truth for quotes.

on:
  schedule:
    - cron: "30 22 * * *" # daily 22:30 UTC (after US close)
  workflow_dispatch:
    inputs:
      company:
        description: "Single company_id to refresh (blank = all onboarded)"
        required: false
        default: ""

permissions:
  # Read only. This job no longer writes to the repository, and giving it write
  # access would let a bug in the refresh script commit whatever it liked.
  contents: read

jobs:
  refresh-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pydantic yfinance requests

      - name: Refresh daily closes
        run: |
          if [ -n "${{ github.event.inputs.company }}" ]; then
            python scripts/refresh_market_data.py --company "${{ github.event.inputs.company }}"
          else
            python scripts/refresh_market_data.py
          fi

      - name: Show refreshed quotes
        run: |
          python - <<'PY'
          import json
          d = json.load(open("backend/data/cache/market_data_cache.json", encoding="utf-8"))
          rows = [
              f"| {c} | {v['data']['price']['value']} | {v['data']['price']['source']} | {v['fetch_date']} |"
              for c, v in sorted(d.items())
          ]
          print("| company | close | source | as of |\n|---|---|---|---|")
          print("\n".join(rows))
          PY

      - name: Report the refresh
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          p = pathlib.Path("backend/data/cache/market_data_cache.json")
          if not p.exists():
              print("No quote cache was written. The API will cold-fetch on demand.")
              raise SystemExit(0)
          d = json.loads(p.read_text(encoding="utf-8"))
          print("## Daily quotes\n")
          print("| company | close | source | as of |")
          print("|---|---|---|---|")
          for c, v in sorted(d.items()):
              data = v.get("data", {}).get("price", {})
              print(f"| {c} | {data.get('value')} | {data.get('source')} | {v.get('fetch_date')} |")
          PY
