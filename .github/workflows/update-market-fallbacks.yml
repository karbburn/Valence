name: Refresh market-data fallbacks

# Weekly refresh of the structural REGISTRY_FALLBACKS (shares outstanding) in
# backend/data/providers/market_data.py from live yfinance data.
# Opens a review PR — never pushes to main directly.
# Prices are NOT in the registry: they are fetched live every day (see
# refresh-market-prices.yml). Beta / RFR / ERP are intentionally excluded
# (analyst-calibrated) and reported for manual review.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC (before India market open)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh-fallbacks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pydantic yfinance requests

      - name: Refresh registry (dry run first for logs)
        run: python scripts/refresh_market_fallbacks.py

      - name: Apply registry updates
        run: python scripts/refresh_market_fallbacks.py --apply

      - name: Smoke-test backend
        run: |
          # The dependency list is derived from pyproject.toml, exactly as tests.yml does it,
          # rather than hand-listed here.
          #
          # This step used to run `pip install fastapi openpyxl pandas numpy httpx` and then
          # `python -m pytest`. Two lists of the same thing, and they drifted. The run failed on
          # 2026-10-05 with:
          #
          #     /opt/hostedtoolcache/Python/3.12.14/x64/bin/python: No module named pytest
          #
          # which is not a failing test and not a broken refresh -- it is a step that could never
          # have run. Adding `pytest` alone would have left the second half of the same problem:
          # pdfplumber, which every filing test imports, was absent too. So the list is derived
          # from the one place it is declared, and there is no longer a second place to forget.
          python -m pip install --upgrade pip
          python - <<'PY' > /tmp/deps.txt
          import tomllib, pathlib
          deps = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["dependencies"]
          print("\n".join(deps))
          PY
          pip install pytest -r /tmp/deps.txt
          python -m pytest backend/tests -q

      - name: Open update PR
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/refresh-market-fallbacks
          delete-branch: true
          title: "chore(data): refresh market-data fallback share counts"
          body: |
            Automated weekly refresh of `REGISTRY_FALLBACKS` `shares` from live
            yfinance data.

            - Only `shares` is touched; price is a daily quote fetched live
              (refresh-market-prices.yml) and beta/RFR/ERP need analyst review.
            - Out-of-bounds figures are rejected by the script (see Action logs).
            - Backend test suite passed in this run.

            Please verify the diff against exchange filings before merging.
          commit-message: "chore(data): refresh market-data fallback share counts"
          labels: data, automated
